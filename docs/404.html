p{color:#aab4cc;line-height:1.6;margin:0 0 26px}

<body>
<main>
<p class="code">404 · NOT FOUND</p>
<h1>That page is <b>off the grid.</b></h1>
<p>The link may be old or mistyped. Everything on Parametra lives on the home page: plugins, families, files and courses. Taking you back in a moment.</p>
<a class="button" id="home" href="/">Back to Parametra</a>
</main>
<script>
(function(){var seg=location.pathname.split('/')[1];var base=/\.github\.io$/.test(location.hostname)&&seg?'/'+seg+'/':'/';var a=document.getElementById('home');a.href=base;setTimeout(function(){location.replace(base);},6000);})();
</script>
</body>
